name: tailor_khata
description: "Order and measurement book for tailors and boutiques."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  drift: ^2.35.2
  sqlite3: ^3.7.1
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  unorm_dart: ^0.3.3
  fl_chart: ^1.3.0
  image_picker: ^1.2.4
  image: ^4.12.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  cryptography: ^2.9.0
  archive: ^4.5.2
  local_auth: ^3.0.2
  file_selector: ^1.1.0
  crypto: ^3.0.7
  google_sign_in: ^7.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700

# Encrypted local database (TD §6): use the SQLCipher build of sqlite3.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
